<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Request</title>
  <!-- You may add your own CSS/JS files or use a library (jQuery, etc.). No framework is required. -->
  <link href="./style.css" rel="stylesheet"/>
</head>
<body>
  <!-- First focusable item is a skip link for accessibility -->
  <a class="skip-link" href="#main">Skip to main content</a>
  <main id="main">
  <h1>Exam Request</h1>

  <!-- TASK 2a: Exam request form.
       Required fields: student, course, requested exam date.
       Also include: a "Needs testing accommodation" checkbox and an
       optional Notes field.
       - Show clear, visible errors for missing required fields.
       - If "Needs testing accommodation" is checked, show a confirmation
         prompt on submit; if the user cancels, uncheck the box and do not submit.
       - Every input needs a label; the form must work with the keyboard alone.
       - On submit: add the request to the table and send it to your
         server code (Task 3). On the hosted URL, saving to the browser
         is fine if no server is available. -->
  <form id="requestForm" novalidate>
     <!-- build the form here -->
      <!-- Form Errors div to clearly display which fields are incomplete. -->
      <div id="formErrors" class="error-summary" role="alert" aria-live="assertive" tabindex="-1" hidden></div>
      <div class="form-group">
        <label for="firstName">
          First Name 
          <span class="required" aria-hidden="true">*</span><span class="visually-hidden"> (required)</span>
        </label>
        <input
          type="text"
          id="firstName"
          name="firstName"
          autocomplete="given-name"
          placeholder="First Name"
          required
        >
        </div>
        <div class="form-group">
         <label for="lastName">
          Last Name 
          <span class="required" aria-hidden="true">*</span><span class="visually-hidden"> (required)</span>
        </label>
        <input
          type="text"
          id="lastName"
          name="lastName"
          autocomplete="family-name"
          placeholder="Last Name"
          required
        >
      </div>
      <div class="form-group">
        <label for="email">
          Email
          <span class="required" aria-hidden="true">*</span><span class="visually-hidden"> (required)</span>
        </label>
        <input 
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          placeholder="name@example.com"
          required
        />
      </div>
      <div class="form-group">
        <label for="fire-department">
          Fire Department
        </label>
        <input 
          type="text"
          id="fire-department"
          name="fire-department"
          autocomplete="organization"
          placeholder="Fire Department"
        />
      </div>
      <div class="form-group">
        <label for="course">
          Course <span class="required" aria-hidden="true">*</span><span class="visually-hidden"> (required)</span>
        </label>
        <select
          id="course"
          name="course"
          required
          >
          <option value="" disabled selected hidden>Select Course...</option>
          <option value="HMO">Hazardous Materials Operations</option>
          <option value="FIO">Fire Instructor I</option>
          <option value="FF2">Firefighter II</option>
          <option value="FAE">Fire Apparatus Engineer</option>
        </select>
      </div>

      <div class="form-group">
        <label for="examDate">
          Requested Exam Date <span class="required" aria-hidden="true">*</span><span class="visually-hidden"> (required)</span>
        </label>
        <input
          type="date"
          id="examDate"
          name="examDate"
          required
        >
      </div>

      <div class="form-group">
        <label class="checkbox-label" for="accommodation">
          <input
            type="checkbox"
            id="accommodation"
            name="accommodation"
          >
          Needs testing accommodation
        </label>
      </div>

      <div class="form-group">
        <label for="notes">Notes (optional)</label>
        <textarea
          id="notes"
          name="notes"
          placeholder="Add any additional details..."
        ></textarea>
      </div>

      <button type="submit">Submit Exam Request</button>

      <div
        id="successMessage"
        class="success"
        role="status"
        aria-live="polite"
      >
        <p id="summary"></p>
      </div>
   

  </form>

  <hr>

  <h2>Current Requests</h2>
  <!-- TASK 2b: Requests table.
       - Load data from sample_requests.json (or from your server).
       - Add a text box that filters the table as the user types.
       - Readable and usable at phone width (~375px). -->
  <label for="filter">Filter requests</label>
  <input type="search" id="filter" placeholder="Type to filter..." aria-describedby="filterStatus">
  <p id="filterStatus" class="visually-hidden" role="status" aria-live="polite"></p>
  <div class="table-wrapper" tabindex="0" role="region" aria-label="Current exam requests" aria-describedby="tableInstructions">
    <p id="tableInstructions" class="visually-hidden">This table may be scrolled horizontally on small screens.</p>
  <table id="requestsTable">
    <!-- rows go here -->
  </table>
  </div>

  
   
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="./index.js" defer></script>
  
  </main>
</body>
</html>
